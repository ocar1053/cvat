metadata:
  name: pytorch-ocarpan-yolov12
  namespace: cvat
  annotations:
    name: YOLO v12(pytorch)
    type: detector
    framework: PyTorch
    spec: |
      [
        { "id": 0, "name": "car", "type": "rectangle" },
        { "id": 1, "name": "cup", "type": "rectangle" }
      ]

spec:
  description: YOLO v12
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  build:
    image: cvat/pytorch-ocarpan-yolov12:latest
    baseImage: nvidia/cuda:12.6.3-cudnn-runtime-ubuntu22.04


    directives:
      preCopy:
        - kind: USER
          value: root
        - kind: RUN
          value: apt update && apt install --no-install-recommends -y wget python3-pip
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
        - kind: RUN
          value: pip install ultralytics
        - kind: RUN
          value: pip install -U ultralytics
        - kind: RUN
          value: pip install opencv-python-headless pillow pyyaml



        # - kind: RUN
        #   value: pip install onnxruntime-gpu=='1.20.*' opencv-python-headless pillow pyyaml
        # - kind: WORKDIR
        #   value: /opt/nuclio
        # - kind: RUN
        #   value: wget https://github.com/WongKinYiu/yolov7/releases/download/v0.1/yolov7-nms-640.onnx
        - kind: RUN
          value: ln -s /usr/bin/python3 /usr/bin/python

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
